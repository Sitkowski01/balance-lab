name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Testy (jednostkowe, wlasnosci FsCheck, statystyczne, sily botow, architektura, e2e CLI)
        run: dotnet test
      - name: Benchmarki uruchamiaja sie (przebieg probny)
        run: dotnet run -c Release --project benchmarks/BalanceLab.Benchmarks -- --filter '*' --job dry
      - name: CLI na zywo
        run: dotnet run --project src/BalanceLab.Cli -- simulate --game connectfour --bots mcts:100 random --games 200 --out report.json
      - name: CLI na zywo - Klejnoty (ukryte karty, trzech graczy)
        run: dotnet run --project src/BalanceLab.Cli -- simulate --game klejnoty --bots greedy ismcts:50 random --games 30 --out klejnoty.json
      - name: CLI na zywo - raport balansu (liga profili, wariant zasad, HTML)
        run: |
          dotnet run --project src/BalanceLab.Cli -- league --game klejnoty --bots greedy:silnik greedy:punkty greedy:zetony --games 40 --html league.html
          dotnet run --project src/BalanceLab.Cli -- compare --game klejnoty --bots greedy:silnik greedy --games 100 --variant "card77.points=4; win=14" --html compare.html

  mutation:
    # Kazdy projekt w osobnym, rownoleglym zadaniu: CI trwa tyle, co najwolniejszy, a nie suma.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [stryker-config.json, stryker-connectfour.json, stryker-klejnoty.json, stryker-bots.json, stryker-simulation.json, stryker-reporting.json, stryker-cli.json]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Mutation testing (Stryker, prog 90%)
        run: |
          dotnet tool restore
          dotnet stryker -f ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-${{ matrix.config }}
          path: StrykerOutput/**/reports
